
<!DOCTYPE html>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    text-align:center;
    margin:0;
}

header{
    background:#0d6efd;
    color:white;
    padding:20px;
    font-size:26px;
}

.card{
    background:white;
    max-width:500px;
    margin:20px auto;
    padding:20px;
    border-radius:15px;
}

.bus{
    display:flex;
    flex-direction:column;
    gap:12px;
    align-items:center;
    margin-top:20px;
}

.row{
    display:grid;
    grid-template-columns:60px 60px 40px 60px 60px;
    gap:8px;
    justify-content:center;
}

.seat{
    background:#198754;
    color:white;
    padding:12px 5px;
    border-radius:8px;
    cursor:pointer;
}

.seat.selected{
    background:#dc3545;
}

.empty{
    width:40px;
}

.door{
    background:#777;
    color:white;
    padding:12px;
    border-radius:8px;
    width:120px;
}

.last-row{
    display:flex;
    gap:8px;
    justify-content:center;
}

button{
    margin-top:20px;
    width:90%;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:8px;
    background:#0d6efd;
    color:white;
}

button:disabled{
    background:#999;
}

</style>

</head>

متابعة
</button>

<script>

let trip = localStorage.getItem("selectedTrip");
let selectedSeat = "";

document.getElementById("tripName").innerHTML =
"الرحلة: " + (trip || "غير محددة");


function chooseSeat(seat){

document.querySelectorAll(".seat").forEach(function(s){
s.classList.remove("selected");
});

seat.classList.add("selected");

selectedSeat = seat.innerHTML;

localStorage.setItem("selectedSeat", selectedSeat);

document.getElementById("info").innerHTML =
"تم اختيار المقعد رقم: " + selectedSeat;

document.getElementById("nextBtn").disabled=false;

}


function continueBooking(){

window.location.href="passenger.html";

}

</script>
