<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تذكرتي</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#0d6efd,#084298);
    color:white;
    text-align:center;
}

.logo{
    width:130px;
    height:130px;
    background:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
    animation:pop .6s ease;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
}

h1{
    margin:25px 0 8px;
    font-size:32px;
}

p{
    margin:0;
    font-size:18px;
    opacity:.9;
}

@keyframes pop{
    0%{ transform:scale(.5); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
}
</style>
</head>

<body>

<div class="logo">
<img src="logo.png" alt="شعار تذكرتي">
</div>

<h1>تذكرتي</h1>
<p>احجز تذكرتك بسهولة وأمان</p>

<script>
setTimeout(function(){
    window.location.href = "home.html";
}, 2500);
</script>

</body>
</html>
