
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تذكرتي</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fa;
}

/* الهيدر */

header{
    background:linear-gradient(135deg,#0d6efd,#084298);
    color:white;
    text-align:center;
    padding:30px 20px;
    box-shadow:0 4px 15px rgba(0,0,0,.2);
}

.logo{
    width:100px;
    height:100px;
    margin:auto;
    background:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
}

header h1{
    margin:15px 0 5px;
    font-size:34px;
}

header p{
    margin:0;
    font-size:18px;
}


/* بطاقة الحجز */

.card{

    background:white;
    width:90%;
    max-width:450px;
    margin:35px auto;
    padding:25px;
    border-radius:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);

}


h2{

    color:#0d6efd;
    margin-top:0;
    text-align:center;

}


.card p{

    text-align:center;
    color:#555;

}


select{

    width:100%;
    padding:15px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:12px;
    margin-top:15px;
    background:white;

}


button{

    width:100%;
    padding:16px;
    margin-top:20px;
    font-size:18px;
    border:none;
    border-radius:12px;
    background:#0d6efd;
    color:white;
    cursor:pointer;
    transition:.3s;

}


button:hover{

    background:#084298;

}


button:disabled{

    background:#aaa;
    cursor:not-allowed;

}


#message{

    margin-top:20px;
    color:#198754;
    font-weight:bold;

}


/* الفوتر */

footer{

    text-align:center;
    color:#777;
    margin:40px 0 20px;
    font-size:14px;

}


</style>

</head>


<body>


<header>


<div class="logo">

<img src="logo.png" alt="شعار تذكرتي">

</div>


<h1>تذكرتي</h1>

<p>احجز تذكرتك بسهولة وأمان</p>


</header>



<div class="card">


<h2>ابدأ الحجز</h2>


<p>اختر رحلتك من القائمة التالية</p>



<select id="trip">


<option value="">-- اختر الرحلة --</option>

<option value="الخرطوم - دنقلا">
الخرطوم - دنقلا
</option>


<option value="الخرطوم - عطبرة">
الخرطوم - عطبرة
</option>


<option value="الخرطوم - بورتسودان">
الخرطوم - بورتسودان
</option>


<option value="كسلا - الخرطوم">
كسلا - الخرطوم
</option>


</select>



<button id="seatBtn" disabled>

اختر المقعد

</button>


<p id="message"></p>


</div>



<footer>

© تذكرتي

</footer>



<script>


let trip=document.getElementById("trip");

let seatBtn=document.getElementById("seatBtn");

let message=document.getElementById("message");



trip.addEventListener("change",function(){


if(trip.value!=""){


seatBtn.disabled=false;


message.innerHTML="✅ تم اختيار الرحلة: "+trip.value;


}else{


seatBtn.disabled=true;


message.innerHTML="";


}


});




seatBtn.onclick=function(){


localStorage.setItem("selectedTrip",trip.value);


window.location.href="seats.html";


};



</script>



</body>

</html>
