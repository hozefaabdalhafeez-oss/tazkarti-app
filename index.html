<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تذكرتي</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fa;
}

header{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:25px 20px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.logo{
    font-size:55px;
}

header h1{
    margin:10px 0 5px;
    font-size:32px;
}

header p{
    margin:0;
    font-size:18px;
    opacity:.95;
}

.card{
    background:white;
    width:90%;
    max-width:450px;
    margin:30px auto;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
}

h2{
    color:#0d6efd;
    margin-top:0;
}

select{
    width:100%;
    padding:15px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:10px;
    margin-top:15px;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#0d6efd;
    color:white;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0b5ed7;
}

button:disabled{
    background:#999;
    cursor:not-allowed;
}

#message{
    margin-top:20px;
    color:#198754;
    font-weight:bold;
}

footer{
    text-align:center;
    color:#777;
    margin:30px 0;
    font-size:14px;
}

</style>

</head>

<body>

<header>

<div class="logo">🚌</div>

<h1>تذكرتي</h1>

<p>احجز تذكرتك بسهولة وأمان</p>

</header>

<div class="card">

<h2>ابدأ الحجز</h2>

<p>اختر رحلتك من القائمة التالية</p>

<select id="trip">

<option value="">-- اختر الرحلة --</option>

<option value="الخرطوم - دنقلا">الخرطوم - دنقلا</option>

<option value="الخرطوم - عطبرة">الخرطوم - عطبرة</option>

<option value="الخرطوم - بورتسودان">الخرطوم - بورتسودان</option>

<option value="كسلا - الخرطوم">كسلا - الخرطوم</option>

</select>

<button id="seatBtn" disabled>
اختر المقعد
</button>

<p id="message"></p>

</div>

<footer>

© تذكرتي

</footer>

<script>

let trip=document.getElementById("trip");
let seatBtn=document.getElementById("seatBtn");
let message=document.getElementById("message");

trip.addEventListener("change",function(){

if(trip.value!=""){

seatBtn.disabled=false;

message.innerHTML="✅ تم اختيار الرحلة: "+trip.value;

}else{

seatBtn.disabled=true;

message.innerHTML="";

}

});

seatBtn.onclick=function(){

localStorage.setItem("selectedTrip",trip.value);

window.location.href="seats.html";

};

</script>

</body>
</html>
