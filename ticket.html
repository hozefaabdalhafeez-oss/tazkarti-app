<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملخص الطلب - تذكرتي</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f7fa;
    margin:0;
    text-align:center;
}

header{
    background:#0d6efd;
    color:white;
    padding:20px;
}

.container{
    max-width:450px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 10px #ccc;
}

.status{
    background:#fff3cd;
    color:#856404;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
    margin-bottom:20px;
}

.item{
    text-align:right;
    margin:12px 0;
    font-size:17px;
}

.whatsapp-btn{
    display:block;
    width:100%;
    margin-top:20px;
    padding:14px;
    background:#25D366;
    color:white;
    border:none;
    border-radius:10px;
    font-size:17px;
    text-decoration:none;
    box-sizing:border-box;
}
</style>
</head>

<body>

<header>
<h1>ملخص طلب الحجز</h1>
</header>

<div class="container">

<div class="status">
⏳ طلبك قيد المراجعة — سيتم تأكيد التذكرة خلال ساعة عبر واتساب
</div>

<div class="item">🚌 الشركة: <span id="company"></span></div>
<div class="item">📍 الرحلة: <span id="trip"></span></div>
<div class="item">💺 المقعد: <span id="seat"></span></div>
<div class="item">👤 الاسم: <span id="name"></span></div>
<div class="item">📞 الهاتف: <span id="phone"></span></div>
<div class="item">⏰ التحرك: <span id="time"></span></div>
<div class="item">💰 السعر: <span id="price"></span></div>
<div class="item">🧾 رقم العملية: <span id="transaction"></span></div>

<a id="whatsappLink" class="whatsapp-btn" target="_blank">
📲 إرسال تفاصيل الحجز عبر واتساب
</a>

</div>

<script>

let company = localStorage.getItem("company") || "غير محددة";
let from = localStorage.getItem("fromCity") || "";
let to = localStorage.getItem("toCity") || "";
let seat = localStorage.getItem("selectedSeat") || "غير محدد";
let name = localStorage.getItem("passengerName") || "غير محدد";
let phone = localStorage.getItem("passengerPhone") || "غير محدد";
let time = localStorage.getItem("time") || "غير محدد";
let price = localStorage.getItem("price") || "غير محدد";
let transaction = localStorage.getItem("transaction") || "غير محدد";

document.getElementById("company").innerText = company;
document.getElementById("trip").innerText = from + " → " + to;
document.getElementById("seat").innerText = seat;
document.getElementById("name").innerText = name;
document.getElementById("phone").innerText = phone;
document.getElementById("time").innerText = time;
document.getElementById("price").innerText = price;
document.getElementById("transaction").innerText = transaction;

// ===== حفظ الحجز الحالي كعنصر جديد في قائمة الحجوزات =====
let currentBooking = {
    id: Date.now(),
    company: company,
    trip: from + " → " + to,
    seat: seat,
    name: name,
    phone: phone,
    time: time,
    price: price,
    transaction: transaction,
    status: "قيد التحقق",
    date: new Date().toLocaleString("ar-EG")
};

let bookings = JSON.parse(localStorage.getItem("bookings")) || [];
bookings.push(currentBooking);
localStorage.setItem("bookings", JSON.stringify(bookings));

let adminNumber = "249118688558";

let message =
"طلب حجز جديد - تذكرتي%0A" +
"الشركة: " + company + "%0A" +
"الرحلة: " + from + " → " + to + "%0A" +
"المقعد: " + seat + "%0A" +
"الاسم: " + name + "%0A" +
"الهاتف: " + phone + "%0A" +
"وقت التحرك: " + time + "%0A" +
"السعر: " + price + "%0A" +
"رقم العملية: " + transaction;

document.getElementById("whatsappLink").href =
"https://wa.me/" + adminNumber + "?text=" + message;

</script>

</body>
</html>
